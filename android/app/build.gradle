plugins {
    id 'com.android.application'
}

// رقم البناء من GitHub Actions: كل نسخة أعلى من التي قبلها فتُثبَّت فوقها دون حذف
def build = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.madmus950.jard'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode build
        versionName "1.0.${build}"
    }

    // تطبيقان من نفس الغلاف: الجرد، والحسابات
    flavorDimensions = ['app']
    productFlavors {
        jard {
            dimension 'app'
            applicationId 'com.madmus950.jard'
            resValue 'string', 'app_name', 'جرد الصيدلية'
        }
        pharmacy {
            dimension 'app'
            applicationId 'com.madmus950.pharmacy'
            resValue 'string', 'app_name', 'حسابات الصيدلية'
        }
        // تصوير الطلبيات: قراءة النص من صور العلب على الجوال نفسه دون إنترنت (ML Kit)
        order {
            dimension 'app'
            applicationId 'com.madmus950.order'
            resValue 'string', 'app_name', 'تصوير الطلبيات'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        }
    }

    signingConfigs {
        release {
            storeFile rootProject.file('jard-release.p12')
            storeType 'pkcs12'
            storePassword 'jard-pharmacy-2026'
            keyAlias 'jard'
            keyPassword 'jard-pharmacy-2026'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // قارئ النصوص اللاتينية مدمجاً في التطبيق: يعمل من أول تشغيل بلا إنترنت
    orderImplementation 'com.google.mlkit:text-recognition:16.0.1'
}
