name: Android APK

on:
  push:
    branches: [main]
    paths:
      - index.html
      - boot.js
      - fbsdk.js
      - config.js
      - pharmacy/**
      - order/**
      - android/**
      - desktop/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web assets (local Firebase, ZXing, fonts)
        run: |
          report() {
            cat "$1"
            tail -n 40 "$1" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'NF' > tail.txt
            split -l 10 tail.txt chunk_
            for f in chunk_*; do echo "::error title=$2::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
            rm -f chunk_* tail.txt
          }
          if ! bash android/build-web.sh > web.log 2>&1; then report web.log jard-assets; exit 1; fi
          cat web.log
          if ! bash android/build-pharmacy.sh > ph.log 2>&1; then report ph.log pharmacy-assets; exit 1; fi
          cat ph.log
          if ! bash android/build-order.sh > or.log 2>&1; then report or.log order-assets; exit 1; fi
          cat or.log
          (cd android/app/src/jard/assets && zip -qr "$GITHUB_WORKSPACE/web-assets.zip" www)
          (cd android/app/src/pharmacy/assets && zip -qr "$GITHUB_WORKSPACE/pharmacy-assets.zip" www)

      - uses: actions/upload-artifact@v4
        with:
          name: pharmacy-www
          path: android/app/src/pharmacy/assets/www
          retention-days: 3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: android
        run: |
          if ! gradle --no-daemon --console=plain assembleRelease > build.log 2>&1; then
            cat build.log
            { grep -E "error:|What went wrong|Could not|FAILURE|> " build.log | head -n 30; tail -n 30 build.log; } \
              | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'NF' | head -n 60 > tail.txt
            split -l 10 tail.txt chunk_
            for f in chunk_*; do echo "::error title=gradle::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
            exit 1
          fi
          tail -n 20 build.log
          find app/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/jard/release/app-jard-release.apk "jard-$V.apk"
          cp android/app/build/outputs/apk/pharmacy/release/app-pharmacy-release.apk "pharmacy-$V.apk"
          cp android/app/build/outputs/apk/order/release/app-order-release.apk "order-$V.apk"
          cp "jard-$V.apk" jard.apk
          cp "pharmacy-$V.apk" pharmacy.apk
          cp "order-$V.apk" order.apk
          NOTES="نسخة $V: jard.apk تطبيق الجرد، pharmacy.apk تطبيق حسابات الصيدلية، order.apk تطبيق تصوير الطلبيات. ثبّت كل ملف فوق نسخته السابقة مباشرة."
          FILES="jard-$V.apk pharmacy-$V.apk order-$V.apk jard.apk pharmacy.apk order.apk web-assets.zip pharmacy-assets.zip"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" $FILES --clobber
          else
            gh release create "v$V" $FILES --title "تطبيقات الصيدلية $V" --notes "$NOTES" --latest
          fi

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: pharmacy-www
          path: desktop/www

      - name: Build Windows installers
        working-directory: desktop
        run: |
          report() {
            cat "$1"
            tail -n 40 "$1" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'NF' > tail.txt
            split -l 10 tail.txt chunk_
            for f in chunk_*; do echo "::error title=$2::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
          }
          ls www | head -40
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          if ! npm install --no-audit --no-fund > npm.log 2>&1; then report npm.log npm; exit 1; fi
          if ! npx electron-builder --win nsis --x64 --publish never > b64.log 2>&1; then report b64.log win-x64; exit 1; fi
          # إلكترون 44 لم يعد يصدر نسخة 32 بت، فالمثبّت 32 بت من آخر نسخة 43
          if ! npx electron-builder --win nsis --ia32 --publish never -c.electronVersion=43.8.10 > b32.log 2>&1; then report b32.log win-ia32; exit 1; fi
          ls -la dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          gh release upload "v$V" desktop/dist/pharmacy-setup-x64.exe desktop/dist/pharmacy-setup-ia32.exe --clobber
