<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f3">
<meta name="robots" content="noindex,nofollow">
<title>حسابات الصيدلية</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<script>/* إن تعطّل التشغيل اعرض السبب بدل صفحة فارغة */
window.addEventListener('error', function (e) { try {
  if (window.__booted) return;
  var t = document.getElementById('bootMsg'); if (!t) return;
  var src = e && e.target && e.target.src;
  t.textContent = src ? 'تعذّر تحميل ملف (' + src.split('/').pop() + ').' : 'تعذّر التشغيل: ' + ((e && e.message) || 'خطأ') + '. حدّث «Android System WebView» من متجر Play.';
} catch (x) {} }, true);</script>
</head>
<body>
<div id="app"><div class="login"><div class="page"><div class="ph" style="border:0"><h1>حسابات الصيدلية</h1><div class="meta" id="bootMsg">جارٍ التحميل…</div></div></div></div></div>
<div id="print"></div>
<script nomodule>document.getElementById('bootMsg').textContent = 'المتصفح قديم ولا يشغّل التطبيق. حدّث «Android System WebView» و«Chrome» من متجر Play.';</script>
<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
